<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AP Environmental Science</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Serif+4:wght@400;600&display=swap">
<style>
:root{--bg:#f3f5ee;--panel:#e2eadb;--ink:#16251a;--mute:#4d6052;--line:#bccbb4;--head:"Bricolage Grotesque","Trebuchet MS",sans-serif;--body:"Source Serif 4",Georgia,serif}
@media (prefers-color-scheme:dark){:root{--bg:#101a13;--panel:#1b2e21;--ink:#e6efe7;--mute:#9fb5a4;--line:#2f4a37}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 clamp(16px,1.6vw,20px)/1.5 var(--body);display:flex;flex-direction:column;align-items:center;padding:clamp(24px,6vw,72px) 20px}
h1{font:800 clamp(34px,5.5vw,64px)/1.1 var(--head);letter-spacing:-.02em;margin:0 0 .2em;text-align:center}
p.sub{color:var(--mute);margin:0 0 2em;text-align:center}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));width:min(100%,1100px)}
.card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;background:var(--panel);border:3px solid var(--line);border-radius:22px;padding:2em 1.2em;color:var(--ink);text-decoration:none;transition:transform .15s,border-color .15s}
a.card:hover,a.card:focus-visible{transform:translateY(-4px);border-color:var(--c);outline:none}
.emo{font-size:clamp(64px,9vw,104px);line-height:1.1}
.card b{font:800 clamp(22px,2.4vw,30px)/1.15 var(--head)}
.card span{color:var(--mute);font-size:.9em}
.go{margin-top:.6em;font:700 .95em var(--head);background:var(--c);color:#fff;border-radius:10px;padding:.5em 1.3em}
.card.soon{opacity:.6;cursor:default}.card.soon .go{background:var(--mute)}
.who{margin-top:2.2em;font:600 .85em var(--head);color:var(--mute)}
.live{display:inline-flex;align-items:center;gap:6px;font:700 .85em var(--head);color:#fff;background:#c0392b;border-radius:999px;padding:.25em .8em}.live i{width:9px;height:9px;border-radius:50%;background:#fff;animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
.new{font:700 .75em var(--head);color:var(--c);border:2px solid var(--c);border-radius:999px;padding:.1em .7em}
.back{align-self:flex-start;font:700 .9em var(--head);color:var(--mute);text-decoration:none;margin-bottom:1em}
</style></head><body>
<a class="back" id="back" href="../">← All classes</a>
<h1>🌱 AP Environmental Science</h1>
<p class="sub" id="sub">Choose the unit your teacher tells you.</p>
<div class="grid" id="g"></div>
<p class="who" id="who"></p>
<script>
/* To add a unit: put its folder (unit4/) next to the others and add one line below. course must match COURSE in that unit's index.html. */
var UNITS=[
 {emoji:"🌿",name:"Unit 1",info:"The Living World: Ecosystems",link:"unit1/",course:"apes",color:"#2e7d4f"},
 {emoji:"🦋",name:"Unit 2",info:"The Living World: Biodiversity",link:"unit2/",course:"apes2",color:"#2e7d4f"},
 {emoji:"👥",name:"Unit 3",info:"Populations",link:"unit3/",course:"apes3",color:"#2e7d4f"}
];
var teacher=/^#teacher$/i.test(location.hash),g=document.getElementById("g"),badges={};
if(teacher)document.getElementById("back").href="../#teacher";
UNITS.forEach(function(u,i){var a=document.createElement("a");a.className="card";a.style.setProperty("--c",u.color);a.href=u.link+(teacher?"#teacher":"");
 var e=document.createElement("div");e.className="emo";e.textContent=u.emoji;var b=document.createElement("b");b.textContent=u.name;var s=document.createElement("span");s.textContent=u.info;
 var lv=document.createElement("div");badges[u.course]=lv;var go=document.createElement("div");go.className="go";go.textContent=teacher?"Open slides →":"Start →";
 a.appendChild(e);a.appendChild(b);a.appendChild(s);if(i===UNITS.length-1){var n=document.createElement("span");n.className="new";n.textContent="Newest";a.appendChild(n)}a.appendChild(lv);a.appendChild(go);g.appendChild(a)});
if(teacher)document.getElementById("who").textContent="Teacher mode: each unit opens with slides and results.";
function check(u){var c=new AbortController();var t=setTimeout(function(){c.abort()},12000);
 fetch("/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"live",course:u.course}),signal:c.signal}).then(function(r){return r.json()}).then(function(d){clearTimeout(t);var L=d&&d.live,el=badges[u.course];el.innerHTML="";
  if(L&&L.act&&(!L.at||Date.now()-L.at<6*3600*1000)){el.innerHTML='<span class="live"><i></i>LIVE now: '+L.act+'</span>'}}).catch(function(){clearTimeout(t)})}
function poll(){UNITS.forEach(check)}poll();setInterval(poll,10000);
</script></body></html>
